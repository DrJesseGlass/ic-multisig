[package]
name = "ic-multisig"
version = "0.2.1"
edition = "2021"
description = "K-of-N approvals over a hashed subject: policy, ballots, tally, optional signatures. For Internet Computer canisters and the clients that verify them."
license = "MIT OR Apache-2.0"
repository = "https://github.com/DrJesseGlass/ic-multisig"
readme = "README.md"
keywords = ["multisig", "threshold", "approvals", "ed25519", "icp"]
categories = ["cryptography", "authentication", "wasm"]

# docs.rs builds with no features by default, which would hide the ed25519
# module and the CandidType impls -- the two things a reader comes to check.
# Building everything then hides the opposite fact, that they are optional
# at all, so the docsrs cfg turns the feature labels back on.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# A range, not one line: sha2 is internal here (Sha256 over bytes, the same
# call in both), but it is shared with whatever else the consumer links.
# candid and ed25519-dalek 2 are on 0.10; a consumer whose other
# dependencies have moved to 0.11 can now have one sha2 rather than two.
# README, "Features", says how to keep one where cargo would pick two.
sha2 = { version = ">=0.10, <0.12", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
candid = { version = "0.10", optional = true }
ed25519-dalek = { version = "2", default-features = false, optional = true }

[features]
default = []
# Derive CandidType on the public types and convert from candid::Principal.
candid = ["dep:candid"]
# Verify and (for tests and clients) produce Ed25519-signed approvals.
ed25519 = ["dep:ed25519-dalek"]

[dev-dependencies]
serde_json = "1"
