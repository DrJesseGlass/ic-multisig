# Dependabot: security updates for every advisory against a dependency in
# Cargo.lock (GitHub's advisory database includes RustSec), and routine
# version updates on the schedules below. Each update is a pull request,
# tested by ci.yml.
#
# This is a library, so Cargo.lock decides only what this repo's own tests
# run against; what a consumer resolves is decided by the requirements in
# Cargo.toml. A pull request that touches only Cargo.lock needs no release.
# One that changes a requirement in Cargo.toml reaches consumers only with
# a release, and a release changes the module hash of every canister that
# takes it (ic-git, ic-vote).
#
# Dependabot pushes its pull requests to branches named dependabot/<...>.
# Git cannot create those while a branch named plainly `dependabot` exists
# (a ref cannot be both a file and a directory), and Dependabot then opens
# nothing, silently from the repo's side. Never name a branch `dependabot`;
# the job log under Insights > Dependency graph > Dependabot shows the
# failure when it happens.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # Patch and minor bumps arrive as one pull request a week rather than
      # one per crate; a major bump, or a security update, comes on its own.
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Both are part of this crate's public API, so moving either is a
      # breaking release made by hand, not a weekly bump.
      #
      # ed25519-dalek: the crate tracks 2 and re-exports its SigningKey,
      # VerifyingKey and Signature (src/ed25519.rs); 3 is a different set
      # of types.
      - dependency-name: ed25519-dalek
        update-types: [version-update:semver-major]
      # candid: CandidType is derived on the public types, and the
      # canisters that consume them hold candid at 0.10. At 0.x a minor
      # bump is a breaking one, so only patches come through.
      - dependency-name: candid
        update-types: [version-update:semver-major, version-update:semver-minor]
      # sha2 is not public API, but it is shared: candid and ed25519-dalek 2
      # are on sha2 0.10, so 0.11 here puts two copies of sha2 and digest
      # in every consumer, which ci.yml refuses and so does ic-git's
      # dependency gate. It moves by hand when those two have moved; drop
      # this entry then.
      - dependency-name: sha2
        update-types: [version-update:semver-major, version-update:semver-minor]

  # The workflow's actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

# Not covered, deliberately: rust-toolchain.toml. It is pinned to match
# ic-git's reproducible build and moves by hand with it.
